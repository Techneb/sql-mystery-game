<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>The Clerk's Desk -- The Ritz Affair</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="learn/learn.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<header class="masthead">
  <div class="mast-title">LE PETIT JOURNAL</div>
  <div class="mast-sub">THE CLERK'S DESK</div>
  <nav class="learn-nav muted"><a href="./">Game</a> &middot; <a href="learn/">The Clerk's Handbook</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="https://alephb.uk">AlephB</a> &middot; <a href="mailto:contact@alephb.uk">Contact</a></nav>
</header>
<main class="desk">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="locked" hidden><p>The desk is locked.</p><button id="btn-unlock">Unlock</button></div>
  <div id="desk" hidden>
    <form id="board-form" class="row">
      <label for="board-url" class="label">BOARD URL</label>
      <input id="board-url" type="url" placeholder="Apps Script /exec URL" required>
      <button class="quiet">Save</button>
    </form>
    <form id="create" class="row create">
      <span class="label">NEW SEASON</span>
      <label>Name <input id="c-name" maxlength="60" required placeholder="Group A, Tuesday"></label>
      <label>Date <input id="c-date" type="date" required></label>
      <label>Penalty <input id="c-penalty" type="number" min="0" max="3600" value="10" required> s per wrong answer</label>
      <button>Create</button>
    </form>
    <div class="label-row"><span class="label">SEASONS</span><button id="btn-refresh" class="quiet">Refresh</button></div>
    <div id="seasons"></div>
    <section id="detail" class="season-detail"></section>
  </div>
</main>
<footer class="learn-foot muted"><a href="./">Game</a> &middot; <a href="learn/">The Clerk's Handbook</a> &middot; <a href="privacy.html">Privacy</a> &middot; <a href="https://alephb.uk">AlephB</a> &middot; <a href="mailto:contact@alephb.uk">Contact</a></footer>
<dialog id="passgate" class="part2"><form method="dialog">
  <div class="label">THE CLERK'S DESK</div>
  <p><label for="pass">Passphrase</label> <input id="pass" type="password" autocomplete="current-password"></p>
  <p class="gate-msg" aria-live="polite"></p>
  <button value="ok">Unlock</button> <button value="" class="quiet" formnovalidate>Cancel</button>
</form></dialog>
<dialog id="qr" class="part2 qr-dialog">
  <div class="label">JOIN THE SEASON</div>
  <h2 class="qr-name"></h2>
  <div class="qr-code"></div>
  <p class="qr-link"></p>
  <button>Close</button>
</dialog>
<script type="module" src="admin.js"></script>
</body>
</html>
