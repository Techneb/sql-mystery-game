<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Setup -- The Clerk's Desk</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="learn/learn.css">
<script src="learn/theme.js"></script>
<link rel="stylesheet" href="admin.css">
</head>
<body>
<button id="btn-theme" class="quiet theme-corner" title="Night edition" aria-label="Night edition"><svg class="icon moon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 8.53A6 6 0 1 1 7.47 2A4.67 4.67 0 0 0 14 8.53Z"/></svg><span class="btn-text">Night edition</span></button>
<header class="masthead">
  <div class="mast-title">LE PETIT JOURNAL</div>
  <div class="mast-sub">THE CLERK'S DESK</div>
  <nav class="learn-nav muted"><a href="./" title="The game">The Ritz Affair</a> &middot; <a href="learn/" title="Training content: SQL lessons and exercises">The Clerk's Handbook</a></nav>
</header>
<nav class="learn-menu"><span class="current" aria-current="page">Setup</span> &middot;
  <a id="monitor-link" href="monitor.html">Global</a> &middot;
  <a id="game-link" href="monitor-game.html">Game</a> &middot;
  <a id="handbook-link" href="monitor-handbook.html">Handbook</a> &middot;
  <a id="explore-link" href="explore.html">Pivot table</a></nav>
<main class="desk">
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <div id="locked" hidden><p>The desk is locked.</p><button id="btn-unlock">Unlock</button></div>
  <div id="desk" hidden>
    <form id="board-form" class="row">
      <label for="board-url" class="label">BOARD URL</label>
      <input id="board-url" type="url" placeholder="Apps Script /exec URL" required>
      <button class="quiet">Save</button>
    </form>
    <form id="create" class="row create">
      <span class="label">NEW SEASON</span>
      <label>Name <input id="c-name" maxlength="60" required placeholder="Group A, Tuesday"></label>
      <label>Date <input id="c-date" type="date" required></label>
      <label>Penalty <input id="c-penalty" type="number" min="0" max="3600" value="10" required> s per wrong answer</label>
      <button>Create</button>
    </form>
    <div class="label-row"><span class="label">SEASONS</span><button id="btn-refresh" class="quiet">Refresh</button></div>
    <div id="seasons"></div>
    <section id="detail" class="season-detail"></section>
  </div>
</main>
<footer class="learn-foot muted"><a href="privacy.html">Privacy notice</a> &middot; <a href="admin.html">The Clerk's Desk</a> &middot; <a href="https://alephb.uk">AlephB</a> &middot; <a href="mailto:contact@alephb.uk">Contact</a></footer>
<dialog id="passgate" class="part2"><form method="dialog">
  <div class="label">THE CLERK'S DESK</div>
  <p><label for="pass">Passphrase</label> <input id="pass" type="password" autocomplete="current-password"></p>
  <p class="gate-msg" aria-live="polite"></p>
  <button value="ok">Unlock</button> <button value="" class="quiet" formnovalidate>Cancel</button>
</form></dialog>
<dialog id="ask" class="part2" aria-labelledby="ask-title" aria-describedby="ask-msg"><form method="dialog">
  <div class="label" id="ask-title">THE CLERK'S DESK</div>
  <p id="ask-msg" class="ask-msg"></p>
  <button value="" class="quiet" autofocus>Cancel</button> <button value="ok">OK</button>
</form></dialog>
<dialog id="rename" class="part2" aria-labelledby="rename-title"><form method="dialog">
  <div class="label" id="rename-title">RENAME THE SEASON</div>
  <p><label for="rename-input">New name</label> <input id="rename-input" type="text" maxlength="60" autocomplete="off" autofocus></p>
  <button value="ok">Rename</button> <button value="" class="quiet" formnovalidate>Cancel</button>
</form></dialog>
<dialog id="qr"class="part2 qr-dialog">
  <div class="label">JOIN THE SEASON</div>
  <h2 class="qr-name"></h2>
  <div class="qr-code"></div>
  <p class="qr-link"></p>
  <button>Close</button>
</dialog>
<script type="module" src="admin.js"></script>
</body>
</html>
