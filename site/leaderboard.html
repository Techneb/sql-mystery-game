<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Leaderboard -- The Ritz Affair</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="learn/learn.css">
<style>
  /* Sized for a projector at the back of a classroom: every row at least 28 px of text. */
  .lb { max-width: 1200px; margin: 0 auto; padding: 8px 24px 40px; text-align: center; }
  .lb h1 { font: 900 clamp(36px, 6vw, 72px)/1.1 "Playfair Display", serif; margin: 24px 0 4px; }
  .dateline { font: italic 400 clamp(22px, 2.6vw, 32px)/1.2 "Cormorant Garamond", Georgia, serif; border-bottom: 3px double var(--ink); padding-bottom: 12px; margin: 0 0 20px; }
  .waiting { font: 700 clamp(30px, 4vw, 48px)/1.2 "Playfair Display", serif; margin: 28px 0 8px; }
  .count { font-size: 30px; margin: 0 0 20px; }
  .joined { list-style: none; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 36px; font: 34px/1.3 "Special Elite", monospace; }
  .ranking { width: 100%; border-collapse: collapse; font-size: 34px; text-align: left; }
  .ranking td { padding: 8px 12px; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  .ranking .rank { width: 2.2em; font: 900 34px "Playfair Display", serif; text-align: right; }
  .ranking .team { font-family: "Special Elite", monospace; overflow-wrap: anywhere; }
  .ranking .time { text-align: right; white-space: nowrap; font-family: "Special Elite", monospace; }
  .ranking tr.playing .time { font: italic 30px "Cormorant Garamond", Georgia, serif; color: var(--rel); }
  .strip { display: inline-flex; gap: 4px; vertical-align: middle; }
  .strip i { display: block; width: 22px; height: 28px; border: 2px solid var(--ink); border-radius: 3px; }
  .strip i.on { background: var(--ink); }
  abbr { text-decoration: none; cursor: help; color: var(--rel); }
  .podium { list-style: none; padding: 0; margin: 12px 0 32px; display: flex; justify-content: center; align-items: flex-end; gap: 16px; }
  .podium li { flex: 0 1 300px; border: 2px solid var(--ink); border-radius: var(--r-card); background: var(--card); padding: 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .podium .place { font: 900 64px/1 "Playfair Display", serif; }
  .podium .team { font: 36px/1.2 "Special Elite", monospace; overflow-wrap: anywhere; }
  .podium .time { font-size: 30px; }
  .podium .place-1 { padding: 36px 12px; border-width: 4px; }
  .podium .place-1 .place { font-size: 96px; color: var(--gold); }
  .podium .place-1 .team { font-size: 46px; }
  #updated { margin-top: 24px; }
  @media (max-width: 700px) {
    .lb { padding: 8px 16px 32px; }
    .ranking, .ranking .rank, .joined, .podium .team { font-size: 22px; }
    .ranking td { padding: 6px 4px; }
    .ranking .rank { width: 1.4em; }
    .ranking tr.playing .time { font-size: 20px; }
    .strip { gap: 2px; }
    .strip i { width: 8px; height: 16px; border-width: 1px; border-radius: 2px; }
    .podium { flex-direction: column; align-items: stretch; }
    .podium li, .podium .place-1 { flex: none; padding: 12px; }
    .podium .place-1 .place { font-size: 64px; }
  }
</style>
</head>
<body>
<header class="masthead">
  <div class="mast-title">LE PETIT JOURNAL</div>
  <div class="mast-sub">THE RITZ AFFAIR &middot; LEADERBOARD</div>
</header>
<main class="lb">
  <h1 id="headline">The Ritz Affair</h1>
  <p class="dateline" id="dateline">&nbsp;</p>
  <div id="board"><p class="waiting">Loading...</p></div>
  <p class="muted" id="updated"></p>
</main>
<script type="module" src="leaderboard.js"></script>
</body>
</html>
