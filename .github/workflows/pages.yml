name: Deploy GitHub Pages

# Publishes site/ (the static Ritz Affair game) to GitHub Pages on every push to main.
# Classic "deploy from a branch" only serves / or /docs, not an arbitrary subfolder like
# site/, so this uses the Actions build type instead of restructuring the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build the compete seasons listed in seasons.txt
        # season-N.sqlite/json are gitignored; the deploy builds whichever seasons the teacher lists.
        run: |
          for n in $(sed 's/#.*//' seasons.txt); do python3 generate_db.py --season "$n"; done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
