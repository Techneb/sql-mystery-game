name: Deploy GitHub Pages

# Publishes site/ (the static Ritz Affair game) to GitHub Pages on every push to main.
# Classic "deploy from a branch" only serves / or /docs, not an arbitrary subfolder like
# site/, so this uses the Actions build type instead of restructuring the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compete databases
        # season-N.sqlite/json are gitignored; every deploy builds all of them (generate_db.SEASONS, ~1.5 s each).
        # A season record on the backend picks one; its answers are checked in the browser like learning mode.
        run: python3 generate_db.py --seasons
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the site and the backend
        # After the season build (the season-file test is skipped without it), before anything is versioned or
        # uploaded: a failing test stops the deploy.
        run: node --test test_site.mjs test_backend.mjs
      - name: Tie the pages to this deploy's script and stylesheet
        # Browsers keep scripts and stylesheets for 10 minutes; versioned URLs stop a fresh page from running a stale
        # cached script (app.js passes the same ?v= to the data files it fetches). Any page or module importing
        # shared.js or qr.js must be in these lists.
        run: |
          v="${GITHUB_SHA::7}"
          sed -i -E "s#(src|href)=\"(app\.js|admin\.js|leaderboard\.js|style\.css|admin\.css|learn/learn\.css)\"#\1=\"\2?v=$v\"#g" site/index.html site/privacy.html site/admin.html site/leaderboard.html
          sed -i -E "s#from \"\./(shared|qr)\.js\"#from \"./\1.js?v=$v\"#g" site/app.js site/admin.js site/leaderboard.js
          grep -q "app.js?v=$v" site/index.html
          grep -q "admin.js?v=$v" site/admin.html
          grep -q "leaderboard.js?v=$v" site/leaderboard.html
          grep -q "shared.js?v=$v" site/app.js
          grep -q "qr.js?v=$v" site/admin.js
          grep -q "shared.js?v=$v" site/leaderboard.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # A separate job (GitHub's own Pages starter layout): rerunning a failed deploy reruns only this job, so it
    # never uploads a second github-pages artifact ("Multiple artifacts named github-pages were found").
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # deploy-pages sometimes looks the artifact up a second after the upload finalised and finds none
        # ("Fetching artifact metadata failed ... No artifacts named github-pages", a GitHub-side race, 3 of 7
        # deploys on 2026-10-09). It fails before any polling, so error_count/timeout do not cover it: try once
        # more after a pause.
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
