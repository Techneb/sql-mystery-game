name: Deploy GitHub Pages

# Deploys mystery.alephb.uk on every push to main: only the bridge to alephb.uk (the old game's rollback was removed 2026-11-12).
# Classic "deploy from a branch" only serves / or /docs, not an arbitrary subfolder like
# site/, so this uses the Actions build type instead of restructuring the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build what mystery.alephb.uk serves
        # The game lives at https://alephb.uk/ritz-affair/ and the handbook at https://alephb.uk/learn/ (publish-alephb.yml,
        # which also builds the season databases and runs the tests). This host serves only the bridge (publish.mjs bridge):
        # / carries the browser's ritz.* keys to the new game in the URL fragment, every other old page redirects.
        run: node publish.mjs bridge out
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # A separate job (GitHub's own Pages starter layout): rerunning a failed deploy reruns only this job, so it
    # never uploads a second github-pages artifact ("Multiple artifacts named github-pages were found").
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # deploy-pages sometimes looks the artifact up a second after the upload finalised and finds none
        # ("Fetching artifact metadata failed ... No artifacts named github-pages", a GitHub-side race, 3 of 7
        # deploys on 2026-10-09). It fails before any polling, so error_count/timeout do not cover it: try once
        # more after a pause.
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
