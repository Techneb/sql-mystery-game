name: Deploy GitHub Pages

# Deploys mystery.alephb.uk on every push to main: the bridge to alephb.uk once BRIDGE is on, the old game until then.
# Classic "deploy from a branch" only serves / or /docs, not an arbitrary subfolder like
# site/, so this uses the Actions build type instead of restructuring the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the compete databases
        # season-N.sqlite/json are gitignored; every deploy builds all of them (generate_db.SEASONS, ~8 s each).
        # A season record on the backend picks one; its answers are checked in the browser like learning mode.
        run: python3 generate_db.py --seasons
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test the site and the backend
        # After the season build (the season-file test is skipped without it), before anything is versioned or
        # uploaded: a failing test stops the deploy.
        run: node --test test_site.mjs test_desk.mjs test_handbook.mjs test_backend.mjs
      - name: Build what mystery.alephb.uk serves
        # The game lives at https://alephb.uk/ritz-affair/ and the handbook at https://alephb.uk/learn/ (publish-alephb.yml).
        # With the repository variable BRIDGE set to "on" (go-live runbook, docs/superpowers/plans/2026-10-31-move-game-to-alephb.md),
        # this host serves only the bridge (publish.mjs bridge): / carries the browser's ritz.* keys to the new game in
        # the URL fragment, every other old page redirects. Until then, the whole game as before, its learn/ pages
        # redirecting to alephb.uk/learn/, every local script and stylesheet versioned with ?v=<commit> (browsers keep
        # them 10 minutes; test_site.mjs checks the rule).
        # Human rule, not enforced here: never push to main during a timed compete session.
        run: |
          if [ "${{ vars.BRIDGE }}" = "on" ]; then
            node publish.mjs bridge out
          else
            node publish.mjs stubs site
            node version_site.mjs "${GITHUB_SHA::7}"
            mv site out
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # A separate job (GitHub's own Pages starter layout): rerunning a failed deploy reruns only this job, so it
    # never uploads a second github-pages artifact ("Multiple artifacts named github-pages were found").
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # deploy-pages sometimes looks the artifact up a second after the upload finalised and finds none
        # ("Fetching artifact metadata failed ... No artifacts named github-pages", a GitHub-side race, 3 of 7
        # deploys on 2026-10-09). It fails before any polling, so error_count/timeout do not cover it: try once
        # more after a pause.
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
