name: Deploy GitHub Pages

# Publishes site/ (the static Ritz Affair game) to GitHub Pages on every push to main.
# Classic "deploy from a branch" only serves / or /docs, not an arbitrary subfolder like
# site/, so this uses the Actions build type instead of restructuring the repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build compete seasons 1-20
        # season-N.sqlite/json are gitignored; every deploy builds all twenty (~4 MB, ~1.5 s each) so the
        # teacher picks and shares one from the ?admin panel without touching the repo.
        run: for n in $(seq 1 20); do python3 generate_db.py --season "$n"; done
      - name: Send the season answers to the leaderboard backend
        # Compete answers are checked by the Apps Script, which must hold the hashes of the seasons just built.
        # Set the repository secrets BOARD_URL (the /exec URL) and ADMIN_KEY (the admin passphrase); without
        # them the step only says so, and the admin panel's Settings shows which seasons are stale.
        env:
          BOARD_URL: ${{ secrets.BOARD_URL }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
        run: python3 generate_db.py --post
      - name: Tie the pages to this deploy's script and stylesheet
        # Browsers keep app.js and style.css for 10 minutes; versioned URLs stop a fresh index.html from running
        # a stale cached app.js (app.js passes the same ?v= to the data files it fetches).
        run: |
          v="${GITHUB_SHA::7}"
          sed -i "s#src=\"app.js\"#src=\"app.js?v=$v\"#; s#href=\"style.css\"#href=\"style.css?v=$v\"#" site/index.html site/privacy.html
          grep -q "app.js?v=$v" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # A separate job (GitHub's own Pages starter layout): rerunning a failed deploy reruns only this job, so it
    # never uploads a second github-pages artifact ("Multiple artifacts named github-pages were found").
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        # deploy-pages sometimes looks the artifact up a second after the upload finalised and finds none
        # ("Fetching artifact metadata failed ... No artifacts named github-pages", a GitHub-side race, 3 of 7
        # deploys on 2026-10-09). It fails before any polling, so error_count/timeout do not cover it: try once
        # more after a pause.
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
